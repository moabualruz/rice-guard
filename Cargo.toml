[workspace]
resolver = "2"
members = ["crates/cli", "crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["rice-guard contributors"]

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
inquire = "0.9"
indicatif = "0.18"
owo-colors = { version = "4.3", features = ["supports-colors"] }
atty = "0.2"

# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
shlex = "1.3"
which = "8.0"
tempfile = "3.27"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.50", features = ["full"] }

# Tree-sitter (evidence extraction)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-php = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.23"
# Kotlin (community crate, less stable)
tree-sitter-kotlin = "0.3"
# Dart (community crate, behind feature flag)
tree-sitter-dart = "0.1"

# Testing
assert_cmd = "2.2"
predicates = "3.1"
insta = { version = "1.46", features = ["yaml"] }

# Workspace crates
rice-guard-core = { path = "crates/core" }
rice-guard-server = { path = "crates/server" }
