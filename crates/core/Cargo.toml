[package]
name = "rice-guard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Gate large/community grammar crates behind an optional feature.
# Default build compiles the stable 10 grammars only.
# Enable `full-grammars` to add Dart and Kotlin support.
full-grammars = ["tree-sitter-dart", "tree-sitter-kotlin"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
semver.workspace = true
sha2.workspace = true
chrono.workspace = true
walkdir.workspace = true
ignore.workspace = true
dirs.workspace = true
shlex.workspace = true
which.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
anyhow.workspace = true
inquire.workspace = true
indicatif.workspace = true
atty.workspace = true

# Tree-sitter for Phase 3 AST-based evidence extraction.
tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-go.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-java.workspace = true
tree-sitter-php.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-bash.workspace = true
# Community crates behind optional feature flag (may have C build issues on some platforms)
tree-sitter-dart = { workspace = true, optional = true }
tree-sitter-kotlin = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
