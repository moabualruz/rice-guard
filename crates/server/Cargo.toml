[package]
name = "rguard-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rguard-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
rmcp.workspace = true
# schemars 1.x — use the version bundled by rmcp (rmcp 1.2 requires schemars 1.x).
# The workspace pins schemars 0.8 for other crates; the server crate overrides to 1.x
# because MCP tool parameter structs must satisfy rmcp::schemars::JsonSchema (1.x).
schemars = "1"
anyhow.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower = "0.5"
tempfile.workspace = true
