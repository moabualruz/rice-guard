name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            install: musl-tools
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            install: gcc-aarch64-linux-gnu musl-tools
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            install: ""
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            install: ""
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            install: ""
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compile deps (Linux)
        if: matrix.install != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.install }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          RICE_GUARD_BUILD_INFO: ${{ github.ref_name }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../rice-guard-${{ matrix.target }}.tar.gz rice-guard
          cd ../../..
          sha256sum rice-guard-${{ matrix.target }}.tar.gz > rice-guard-${{ matrix.target }}.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/rice-guard.exe -DestinationPath rice-guard-${{ matrix.target }}.zip
          (Get-FileHash rice-guard-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  rice-guard-${{ matrix.target }}.zip" | Out-File -Encoding ascii rice-guard-${{ matrix.target }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rice-guard-${{ matrix.target }}
          path: |
            rice-guard-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
