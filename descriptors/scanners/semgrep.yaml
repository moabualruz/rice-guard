name: semgrep
version: ">=1.60"
languages:
  - go
  - python
  - javascript
  - typescript
  - java
  - kotlin
  - php
  - ruby
  - rust
  - dart
  - csharp
install:
  check: "semgrep --version"
  pip: "pip install semgrep"
  brew: "brew install semgrep"
  docker: "docker pull semgrep/semgrep"
commands:
  scan:
    cmd: "semgrep --config auto --json -o {{output_dir}}/semgrep.json ."
  security:
    cmd: "semgrep --config p/security --json -o {{output_dir}}/semgrep.json ."
  quick:
    cmd: "semgrep --config p/default --json -o {{output_dir}}/semgrep.json ."
output_format: json
severity_map:
  ERROR: critical
  WARNING: high
  INFO: low
